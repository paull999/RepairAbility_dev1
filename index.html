function sbAdapter(sb){
  const cache=new Map(),subs=new Map();let chan=null,ready=null,first=true;
  const er=e=>{const c=String(e&&e.code||'');return Object.assign(new Error(e&&e.message||'Database error'),{code:c==='42501'?'invalid_argument':undefined,raw:e})};
  const emit=c=>(subs.get(c)||new Set()).forEach(f=>{try{f()}catch(x){console.error(x)}});
  const BK='photos',bmap=new Map();let brt=null;
  const toDU=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
  const bup=async(id,du)=>{const bl=await(await fetch(du)).blob();const{error}=await sb.storage.from(BK).upload(id,bl,{contentType:bl.type||'application/octet-stream',upsert:false});if(error&&!/exist|duplicate/i.test(error.message||''))throw er(error)};
  const fetchBlobs=async()=>{
    const names=[];for(let o=0;;o+=100){const{data,error}=await sb.storage.from(BK).list('',{limit:100,offset:o});if(error)throw er(error);data.forEach(x=>names.push(x.name));if(data.length<100)break}
    const todo=names.filter(n=>!bmap.has(n));
    for(let i=0;i<todo.length;i+=6)await Promise.all(todo.slice(i,i+6).map(async n=>{const{data,error}=await sb.storage.from(BK).download(n);if(!error&&data)bmap.set(n,await toDU(data))}));
    const old=new Map();
    for(let a=0;;a+=1000){const{data,error}=await sb.from('docs').select('id,data').eq('coll','blobs').order('id').range(a,a+999);if(error)break;data.forEach(r=>{const x=r.data||{},b=old.get(x.b)||{n:x.n,parts:[],ids:[]};b.parts[x.i]=x.d;b.ids.push(r.id);old.set(x.b,b)});if(data.length<1000)break}

      if(!bmap.has(id)){try{await bup(id,du)}catch(e){bmap.set(id,du);continue}bmap.set(id,du)}
      for(const k of b.ids)await sb.from('docs').delete().eq('path','blobs/'+k)}
    const m=new Map();bmap.forEach((d,id)=>m.set(id+'~0',{b:id,i:0,n:1,d}));cache.set('blobs',m)};
  const fetchColl=async c=>{if(c==='blobs')return fetchBlobs();const m=new Map();for(let a=0;;a+=1000){const{data,error}=await sb.from('docs').select('id,data').eq('coll',c).order('id').range(a,a+999);if(error)throw er(error);data.forEach(r=>m.set(r.id,r.data));if(data.length<1000)break}cache.set(c,m)};
  const ensure=()=>{if(ready)return ready;ready=new Promise(res=>{
    chan=sb.channel('ra-docs').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{const r=p.eventType==='DELETE'?p.old:p.new;if(!r||!r.coll||r.coll==='blobs'||!cache.has(r.coll))return;if(cache.has('blobs')){clearTimeout(brt);brt=setTimeout(()=>fetchBlobs().then(()=>emit('blobs')).catch(()=>{}),1500)}if(p.eventType==='DELETE')cache.get(r.coll).delete(r.id);else cache.get(r.coll).set(r.id,r.data);emit(r.coll)})
      .subscribe(st=>{if(st==='SUBSCRIBED'){if(!first)[...cache.keys()].forEach(c=>fetchColl(c).then(()=>emit(c)).catch(()=>{}));first=false;res()}});
    setTimeout(res,6000)});return ready};
  const listen=(c,fn,bad)=>{let off=false;const f=()=>{if(!off)fn()};(subs.get(c)||subs.set(c,new Set()).get(c)).add(f);
    ensure().then(()=>cache.has(c)?null:fetchColl(c)).then(()=>emit(c)).catch(e=>{if(!off&&bad)bad(e)});
    return()=>{off=true;subs.get(c).delete(f)}};
  const csnap=c=>({metadata:{fromCache:false},docs:[...(cache.get(c)||new Map())].map(([id,d])=>({id,data:()=>d}))});
  const split=p=>{const i=p.indexOf('/');return[p.slice(0,i),p.slice(i+1)]};
  return{
    putBlob:async(id,du)=>{await bup(id,du);bmap.set(id,du);if(cache.has('blobs')){cache.get('blobs').set(id+'~0',{b:id,i:0,n:1,d:du});emit('blobs')}},
    collection:c=>({
      onSnapshot:(ok,bad)=>listen(c,()=>ok(csnap(c)),bad),
      get:async()=>{await fetchColl(c);return csnap(c)}}),
    doc:p=>{const[c,id]=split(p);return{
      set:async d=>{if(c==='blobs'){if(d&&d.n===1&&d.i===0)await bup(d.b,d.d);return}const{error}=await sb.from('docs').upsert({path:p,coll:c,id,data:d});if(error)throw er(error);if(cache.has(c)){cache.get(c).set(id,d);emit(c)}},
      delete:async()=>{if(c==='blobs'){const b=id.split('~')[0];await sb.storage.from(BK).remove([b]);bmap.delete(b);if(cache.has(c)){cache.get(c).delete(b+'~0');emit(c)}return}const{error}=await sb.from('docs').delete().eq('path',p);if(error)throw er(error);if(cache.has(c)){cache.get(c).delete(id);emit(c)}},
      onSnapshot:(ok,bad)=>listen(c,()=>{const d=(cache.get(c)||new Map()).get(id);ok({metadata:{fromCache:false},exists:d!==undefined,id,data:()=>d})},bad),
      acquire:async()=>({acquired:true})}}}}

  const err=(m,ok)=>{const p=$('#aerr');p.textContent=m;p.style.color=ok?'var(--ink)':'var(--urgent)'};
  $('#af').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),em=(f.email||'').trim(),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;
    try{
      if(mode==='in'){const{data,error}=await SB.auth.signInWithPassword({email:em,password:f.pw});if(error)return err(/confirm/i.test(error.message)?'Please confirm your email address first. Check your inbox for the link.':'Email or password is incorrect.');au.hidden=true;SBRES&&SBRES(data.session)}
      else if(mode==='up'){const pe=pwErr(f.pw);if(pe)return err(pe);if(f.pw!==f.pw2)return err('The passwords do not match');
        const{data,error}=await SB.auth.signUp({email:em,password:f.pw,options:{data:{name:(f.name||'').trim()},emailRedirectTo:location.href.split('#')[0]}});

        if(data.session){au.hidden=true;SBRES&&SBRES(data.session)}else err('Account created. Check your email for a confirmation link, then sign in.',1)}

async function sbSetPw(email,pw){try{const{data,error}=await SB.functions.invoke('set-user-password',{body:{email,password:pw}});if(error){let m=error.message||'The account could not be updated';try{const j=await error.context.json();if(j&&j.error)m=j.error}catch(x){}return{ok:false,msg:m}}return{ok:true,created:!!(data&&data.created)}}catch(e){return{ok:false,msg:(e&&e.message)||'The account could not be updated'}}}
function sbPw(mode,id){
  const u=id?D.users.find(x=>x.id===id):null,box=$('#pwdc');
  const head=(t,s)=>`<h2 style="margin:0 0 4px;font-size:20px">${t}</h2><p style="margin:0 0 14px;color:var(--mute)">${s}</p>`;
  const bar=b=>`<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:6px"><button type="button" class="btn ghost" id="pwx">Cancel</button>${b}</div>`;
  if(mode==='issue'||(mode==='change'&&u&&ME&&u.id!==ME.id)){

  if(!$('#pwd').open)$('#pwd').showModal();
}
async function sbSend(j,a,fs,ctx){
  const res=[];
  for(const f of fs){const em=f.channel==='Email',to=em?(a.email||''):(a.phone||'');
    if(!to){res.push([f,false,'No '+(em?'email address':'phone number')+' is saved for '+a.name]);continue}
    try{const{error}=await SB.functions.invoke('send-message',{body:{channel:f.channel,to,subject:renderTpl(f.subject,ctx),body:renderTpl(f.body,ctx)}});
      if(error){let msg=error.message||'The message could not be sent';try{const x=await error.context.json();if(x&&x.error)msg=x.error}catch(e){}res.push([f,false,msg])}else res.push([f,true,''])}
    catch(e){res.push([f,false,(e&&e.message)||'The message could not be sent'])}}
  const bad=res.filter(r=>!r[1]);
  if(!bad.length){toast(res.length>1?res.length+' messages sent to '+a.name:'Message sent to '+a.name);return}

  $('#pvn').onclick=()=>$('#pv').close();if(!$('#pv').open)$('#pv').showModal();
}
async function sbBoot(){

  if(!c.url||!c.anonKey||/YOUR/i.test(c.url+c.anonKey))return sbSetup('Open config.js and enter your Supabase project URL and anon key, then reload this page.');
  SB=window.SB=supabase.createClient(c.url,c.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){RECOV=true;if(ME){RECOV=false;sbPw('change',ME.id)}}if(ev==='SIGNED_OUT'&&ME)location.reload()});
  let{data:{session}}=await SB.auth.getSession();

  if(!CLOUD){$('#boot').hidden=true;sbSetup('The database could not be reached or the schema has not been installed. Run supabase/schema.sql in your Supabase project, then reload.');return}

  ME=D.users.find(u=>(u.email||'').toLowerCase()===em&&u.status==='Active')||null;
  if(!ME){signOut('Your account is not set up as an active user. Ask an administrator.');return}

  if(RECOV)sbPw('change',ME.id);
}
